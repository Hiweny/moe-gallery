<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080c">
<meta name="description" content="21个精选美少女图源 · 二次元 · 写真 · JK · 白丝 · Pixiv · 全屏浏览">
<title>MoeGallery · 美少女画廊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💫</text></svg>">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#08080c;
  --surface:rgba(22,22,34,.78);
  --border:rgba(255,255,255,.055);
  --text:#e8e4e0;
  --sub:rgba(232,228,224,.38);
  --muted:rgba(255,255,255,.12);
  --accent:#c8a882;
  --accent2:#a89bb8;
  --accent-glow:rgba(200,168,130,.18);
  --danger:#e0556a;
  --radius:14px;
  --radius-sm:9px;
  --font:'Inter','SF Pro Display','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'SF Mono','JetBrains Mono','Fira Code',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --ease-out-expo:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(168,155,184,.03) 0%,transparent 55%),radial-gradient(ellipse at 80% 100%,rgba(200,168,130,.025) 0%,transparent 45%);pointer-events:none;z-index:0}

/* ============================================================
   AMBIENT GLOW behind image
   ============================================================ */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .8s ease}
.ambient.show{opacity:1}
.ambient .orb{position:absolute;width:50vmax;height:50vmax;border-radius:50%;filter:blur(80px);opacity:.12;transform:translate(-50%,-50%);transition:left .8s ease,top .8s ease,background .6s ease}
.ambient .orb:nth-child(1){left:50%;top:50%;background:var(--accent)}
.ambient .orb:nth-child(2){left:50%;top:50%;background:var(--accent2);width:35vmax;height:35vmax;opacity:.08}

/* ============================================================
   STAGE
   ============================================================ */
.stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage.portrait{align-items:flex-start;padding-top:max(54px,calc(var(--safe-top) + 44px))}
.stage.landscape{align-items:center}
.il{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .45s var(--ease-out-expo)}
.il img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .55s var(--ease-out-expo),transform .55s var(--ease-out-expo);pointer-events:none;-webkit-user-drag:none;will-change:opacity,transform;transform:scale(1.03)}
.il.a{z-index:3}.il.a img{opacity:1;transform:scale(1)}
.il.portrait img{max-height:calc(100vh - 110px);object-fit:contain}
.il.landscape img{max-width:100vw;max-height:100vh;object-fit:contain}

/* ============================================================
   IMAGE INFO OVERLAY
   ============================================================ */
.info-overlay{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:16px 20px calc(var(--safe-bottom) + 16px);background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;pointer-events:none;transition:opacity .4s ease;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.info-overlay.show{opacity:1}
.info-overlay .info-left{font-size:10px;color:rgba(255,255,255,.5);line-height:1.6}
.info-overlay .info-left b{color:rgba(255,255,255,.8);font-weight:500}
.info-overlay .info-right{font-size:10px;color:rgba(255,255,255,.4);text-align:right}

/* ============================================================
   LOADING
   ============================================================ */
.ldr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;transition:opacity .4s}
.ldr.h{opacity:0}
.ldr-ring{width:34px;height:34px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:ldr-spin .65s linear infinite}
@keyframes ldr-spin{to{transform:rotate(360deg)}}
.ldr-dots{display:none;gap:5px;margin-top:14px}
.ldr-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18);animation:ldr-dot 1.2s ease-in-out infinite}
.ldr-dots i:nth-child(2){animation-delay:.15s}
.ldr-dots i:nth-child(3){animation-delay:.3s}
@keyframes ldr-dot{0%,80%,100%{transform:scale(.35);opacity:.12}40%{transform:scale(1);opacity:1}}
.ldr-err{display:none;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
.ldr-err b{font-size:36px;display:block;margin-bottom:6px;opacity:.35}
.ldr-err button{margin-top:10px;padding:8px 22px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;pointer-events:auto;transition:all .15s;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ldr-err button:active{transform:scale(.92);background:rgba(255,255,255,.08)}

/* ============================================================
   GLASS
   ============================================================ */
.gl{background:var(--surface);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border)}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 7px) 12px 5px;pointer-events:none;gap:8px;transition:opacity .35s ease,transform .35s var(--ease-out-expo)}
.topbar.hidden{opacity:0;transform:translateY(-20px);pointer-events:none}
.topbar>*{pointer-events:auto}
.src-badge{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;color:var(--sub);max-width:55vw;overflow:hidden;flex-shrink:1}
.src-badge .si{font-size:15px;flex-shrink:0}
.src-badge .sn{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-badge .cnt{color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;transition:transform .15s var(--ease-spring)}
.ctrl-row{display:flex;gap:3px;flex-shrink:0}
.ctrl-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--text);flex-shrink:0;background:transparent;border:none;outline:none;position:relative}
.ctrl-btn:active{transform:scale(.82);background:rgba(255,255,255,.06)}
.ctrl-btn.active{background:var(--accent);box-shadow:0 0 18px var(--accent-glow)}
.ctrl-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctrl-btn .badge-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}

/* ============================================================
   BOTTOM BAR
   ============================================================ */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 8px calc(var(--safe-bottom) + 5px);pointer-events:none;transition:opacity .35s ease,transform .35s var(--ease-out-expo);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bottombar::-webkit-scrollbar{display:none}
.bottombar.hidden{opacity:0;transform:translateY(20px);pointer-events:none}
.bottombar>*{pointer-events:auto;flex-shrink:0}
.nav-btn{display:flex;align-items:center;gap:4px;padding:7px 13px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;color:var(--text);background:transparent;border:none;outline:none}
.nav-btn:active{transform:scale(.9);background:rgba(255,255,255,.05)}
.nav-btn.accent{background:var(--accent);color:#1a1a1a;box-shadow:0 0 20px rgba(200,168,130,.3);font-weight:600}
.nav-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   EDGE ARROWS
   ============================================================ */
.edge-arrow{position:fixed;top:50%;z-index:20;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;transform:translateY(-50%);opacity:0;pointer-events:none;color:var(--text);background:transparent;border:none;outline:none}
.edge-arrow:hover{opacity:1;box-shadow:0 0 28px rgba(0,0,0,.5)}
.edge-arrow:active{transform:translateY(-50%) scale(.82)}
.edge-arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.edge-arrow.left{left:8px}.edge-arrow.right{right:8px}
@media(min-width:769px){.edge-arrow{opacity:.2;pointer-events:auto}}

/* ============================================================
   TOAST
   ============================================================ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(8px);z-index:35;padding:9px 20px;border-radius:22px;font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:all .28s var(--ease-spring);white-space:nowrap;color:var(--text);max-width:80vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   OVERLAY
   ============================================================ */
.overlay{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}

/* ============================================================
   DRAWER PANEL
   ============================================================ */
.drawer{position:fixed;bottom:0;left:0;right:0;z-index:26;max-height:78vh;background:rgba(10,10,18,.97);backdrop-filter:blur(36px);-webkit-backdrop-filter:blur(36px);border-top:1px solid var(--border);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .4s var(--ease-out-expo);display:flex;flex-direction:column;overflow:hidden}
.drawer.show{transform:translateY(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex-shrink:0}
.drawer-header h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.drawer-header .close-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--sub);background:transparent;border:none;outline:none;font-size:18px}
.drawer-header .close-btn:active{background:rgba(255,255,255,.06)}
.drawer-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(var(--safe-bottom) + 16px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.drawer-body::-webkit-scrollbar{width:3px}.drawer-body::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}

/* ============================================================
   SOURCE CARDS
   ============================================================ */
.src-group{margin-bottom:2px}
.src-group-title{font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px 2px;display:flex;align-items:center;gap:6px}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px;margin-bottom:2px}
.src-card{padding:10px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.025);cursor:pointer;transition:all .18s;overflow:hidden;position:relative}
.src-card:active{transform:scale(.95);background:rgba(255,255,255,.05)}
.src-card.current{border-color:rgba(200,168,130,.3);background:rgba(200,168,130,.04)}
.src-card .sc-name{font-size:12px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.src-card .sc-name .sc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.src-card .sc-meta{font-size:9px;color:var(--sub);display:flex;gap:5px}
.src-card .sc-meta span{padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.04);font-family:var(--mono);font-size:8px}
.src-card .sc-info{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-card .sc-detail{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);cursor:pointer;transition:all .15s;background:transparent;border:none;outline:none;opacity:0}
.src-card:hover .sc-detail,.src-card:active .sc-detail{opacity:1}
.src-card .sc-detail:active{background:var(--accent);color:#1a1a1a}

/* ============================================================
   API DETAIL MODAL
   ============================================================ */
.api-modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.api-modal.show{pointer-events:auto}
.api-modal .api-card{width:100%;max-width:520px;max-height:82vh;background:rgba(12,12,22,.98);backdrop-filter:blur(36px);-webkit-backdrop-filter:blur(36px);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px 18px calc(var(--safe-bottom) + 18px);overflow-y:auto;transform:translateY(100%);transition:transform .4s var(--ease-out-expo)}
.api-modal.show .api-card{transform:translateY(0)}
.api-modal .api-title{font-size:18px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.api-modal .api-cat{font-size:11px;color:var(--accent);margin-bottom:14px}
.api-modal .api-section{margin-bottom:16px}
.api-modal .api-section h4{font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.api-modal .api-code{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:10.5px;line-height:1.65;color:#a8c8a8;overflow-x:auto;white-space:pre-wrap;word-break:break-all;position:relative}
.api-modal .copy-inline{position:absolute;top:7px;right:7px;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);font-size:10px;cursor:pointer;transition:all .15s;font-family:var(--font)}
.api-modal .copy-inline:active{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
.api-modal .copy-inline.copied{background:#4a9;border-color:#4a9;color:#fff}
.api-modal .param-table{width:100%;font-size:10.5px;border-collapse:collapse}
.api-modal .param-table td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.03)}
.api-modal .param-table td:first-child{font-family:var(--mono);color:var(--accent2);font-size:10px;width:28%}
.api-modal .param-table td:nth-child(2){color:var(--sub);width:34%}
.api-modal .param-table td:last-child{color:var(--muted);font-size:9px}
.api-modal .tag{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.05);font-size:9px;margin-right:3px;color:var(--sub)}
.api-modal .close-row{text-align:center;margin-top:10px}
.api-modal .close-row button{padding:8px 28px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s}
.api-modal .close-row button:active{transform:scale(.92);background:rgba(255,255,255,.1)}

/* ============================================================
   FAVORITES
   ============================================================ */
.fav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,.018);border:1px solid rgba(255,255,255,.02);margin-bottom:5px;transition:all .15s}
.fav-item:hover{background:rgba(255,255,255,.035)}
.fav-item .fav-thumb{width:46px;height:46px;border-radius:7px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.02)}
.fav-item .fav-info{flex:1;min-width:0}
.fav-item .fav-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-item .fav-url{font-size:9px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.fav-item .fav-actions{display:flex;gap:3px;flex-shrink:0}
.fav-item .fav-act{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--sub);background:transparent;border:none;outline:none;font-size:11px}
.fav-item .fav-act:active{background:rgba(255,255,255,.06);color:var(--text)}
.fav-empty{text-align:center;padding:30px 20px;color:var(--sub);font-size:13px}
.fav-empty b{font-size:40px;display:block;margin-bottom:8px;opacity:.35}
.fav-actions-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fav-actions-bar button{padding:7px 14px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);outline:none}
.fav-actions-bar button:active{transform:scale(.93);background:rgba(255,255,255,.08)}
.fav-actions-bar button.danger{color:var(--danger);border-color:rgba(224,85,106,.15)}

/* ============================================================
   HELP MODAL
   ============================================================ */
.help-modal{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}
.help-modal.show{opacity:1;pointer-events:auto}
.help-card{padding:22px 20px 18px;max-width:340px;width:88%;text-align:center;border-radius:18px;overflow:hidden}
.help-card h3{font-size:16px;margin-bottom:14px}
.help-card .keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;text-align:left;font-size:11px;color:var(--sub);margin-bottom:16px}
.help-card kbd{display:inline-block;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.05);font-size:10px;font-family:var(--mono);color:var(--text);border:1px solid rgba(255,255,255,.06);text-align:center;min-width:24px}
.help-card button{padding:8px 24px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s}
.help-card button:active{transform:scale(.92)}
.help-card p{font-size:10px;color:var(--muted);margin-bottom:14px}

/* ============================================================
   HEART PARTICLES
   ============================================================ */
.heart-particle{position:fixed;pointer-events:none;z-index:40;font-size:20px;animation:heart-up .9s ease-out forwards}
@keyframes heart-up{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.6) rotate(15deg)}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:374px){
  .ctrl-btn{width:28px;height:28px}.ctrl-btn svg{width:13px;height:13px}
  .nav-btn{padding:5px 9px;font-size:10px;gap:2px}.bottombar{gap:3px}
  .nav-btn svg{width:12px;height:12px}
  .src-badge{padding:5px 9px;font-size:10px;gap:4px;max-width:45vw}
  .src-badge .si{font-size:12px}.src-badge .cnt{font-size:11px}
  .src-grid{grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:4px}
  .src-card{padding:7px 9px}.src-card .sc-name{font-size:10px}
  .drawer-header{padding:12px 14px 8px}.drawer-body{padding:0 10px calc(var(--safe-bottom) + 10px)}
  .api-modal .api-card{padding:16px 14px calc(var(--safe-bottom) + 14px)}
}
@media(min-width:375px) and (max-width:480px){
  .ctrl-btn{width:30px;height:30px}.ctrl-btn svg{width:14px;height:14px}
  .nav-btn{padding:6px 10px;font-size:10px;gap:3px}.bottombar{gap:4px}
  .src-badge{padding:6px 10px;font-size:11px;gap:5px;max-width:50vw}
  .src-grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:5px}
  .src-card{padding:8px 10px}
}
@media(min-width:481px) and (max-width:768px){
  .src-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media(min-width:769px){
  .src-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .nav-btn:hover{background:rgba(255,255,255,.03)}
  .ctrl-btn:hover{background:rgba(255,255,255,.04)}
}
</style>
</head>
<body>

<!-- Ambient Glow -->
<div class="ambient" id="ambient"><div class="orb"></div><div class="orb"></div></div>

<!-- Stage -->
<div class="stage" id="stage">
  <div class="il a" id="L1"><img id="I1" src="" alt="" draggable="false"></div>
  <div class="il" id="L2"><img id="I2" src="" alt="" draggable="false"></div>
  <div class="info-overlay" id="info-overlay">
    <div class="info-left"><b id="info-src">—</b><br><span id="info-dims">—</span></div>
    <div class="info-right" id="info-pid"></div>

<script>
(function(){

'yujn-acg':    {n:'雨今ACG',      c:'二次元',  type:'img',u:'https://api.yujn.cn/api/ACG.php',method:'GET',desc:'雨今ACG随机图，1080×1350'},
'yujn-ecy':    {n:'雨今二次元',    c:'二次元',  type:'img',u:'https://api.yujn.cn/api/ecy.php',method:'GET',desc:'雨今二次元WebP，1920×1080'},

// Pixiv

// 写真
'yingdao-xz1': {n:'少女写真',      c:'写真',    type:'img',u:'https://api.r10086.com/樱道随机图片api接口.php?图片系列=少女写真1',method:'GET',desc:'樱道少女写真，WebP格式'},

// JK
'yujn-jk':     {n:'JK制服',       c:'JK制服',  type:'img',u:'https://api.yujn.cn/api/jk.php',method:'GET',desc:'雨今JK制服PNG，1000×1442'},

// 白丝
'xxapi-bs':    {n:'白丝(xxapi)',   c:'白丝',    type:'redirect',u:'https://v2.xxapi.cn/api/baisi?return=302',method:'GET',desc:'小小API白丝302跳转，1080×1360'},
'yujn-bs':     {n:'白丝(雨今)',    c:'白丝',    type:'img',u:'https://api.yujn.cn/api/baisi.php',method:'GET',desc:'雨今白丝随机图，960×1280'},

// 综合美女
'xxapi-3d':    {n:'三次元美女',    c:'综合美女',type:'redirect',u:'https://v2.xxapi.cn/api/meinvpic?return=302',method:'GET',desc:'小小API三次元美女302跳转'},
'yujn-ksxjj':  {n:'小姐姐',       c:'综合美女',type:'img',u:'https://api.yujn.cn/api/ksxjj.php',method:'GET',desc:'雨今快手小姐姐，955×1601'},
'yujn-xjj':    {n:'小姐姐图',     c:'综合美女',type:'img',u:'https://api.yujn.cn/api/xjjtp.php',method:'GET',desc:'雨今小姐姐图，872×1552'}
};

/* ============================================================
   STATE
   ============================================================ */
var CO=['二次元壁纸','二次元','Pixiv','写真','JK制服','白丝','综合美女'];
var KS=Object.keys(D), cur='loliapi-pe', ly='L1', ld=false, at=false, atm=null;
var HI=[], hp=-1, tot=0, ttm=null, utm=null;
var favs=JSON.parse(localStorage.getItem('mg_favs')||'[]');
var AINT=5000, MAX_TO=16000;
var currentImgUrl='', currentOrientation='', currentMeta=null;

/* ============================================================
   DOM
   ============================================================ */
var $=function(i){return document.getElementById(i)};
var I1=$('I1'),I2=$('I2'),L1=$('L1'),L2=$('L2'),stage=$('stage'),ldr=$('ldr');
var ldrRing=$('ldr-ring'),ldrDots=$('ldr-dots'),ldrErr=$('ldr-err');
var badgeIcon=$('badge-icon'),badgeName=$('badge-name'),badgeCnt=$('badge-cnt');
var toast=$('toast'),overlay=$('overlay'),favDot=$('fav-dot');
var infoOverlay=$('info-overlay'),infoSrc=$('info-src'),infoDims=$('info-dims'),infoPid=$('info-pid');
var topbar=$('topbar'),bottombar=$('bottombar'),ambient=$('ambient');

function aEl(){return ly==='L1'?L1:L2}
function nEl(){return ly==='L1'?L2:L1}
function aIm(){return ly==='L1'?I1:I2}
function nIm(){return ly==='L1'?I2:I1}

/* ============================================================
   UI AUTO-HIDE (Cinema Mode)
   ============================================================ */
function showUI(){
  topbar.classList.remove('hidden');bottombar.classList.remove('hidden');
  document.getElementById('arrow-left').style.opacity=window.innerWidth>=769?'0.2':'0';
  document.getElementById('arrow-right').style.opacity=window.innerWidth>=769?'0.2':'0';
  resetUITimer()
}
function hideUI(){
  topbar.classList.add('hidden');bottombar.classList.add('hidden');
  document.getElementById('arrow-left').style.opacity='0';
  document.getElementById('arrow-right').style.opacity='0';
  infoOverlay.classList.remove('show')
}
function resetUITimer(){clearTimeout(utm);utm=setTimeout(hideUI,4000)}
document.addEventListener('mousemove',function(){if(window.innerWidth>=769)showUI()});
document.addEventListener('touchstart',function(e){if(!e.target.closest('button,.drawer,.api-modal,.help-modal,.overlay'))showUI()},{passive:true});

/* ============================================================
   CORE — Image Loading
   ============================================================ */
function updateBadge(){
  var s=D[cur], ci=CATS[s.c]||{i:'🖼️',c:'#c8a882'};
  badgeIcon.textContent=ci.i; badgeName.textContent=s.n;
}

function imgUrl(){var b=D[cur].u;return b+(b.indexOf('?')>-1?'&':'?')+'_t='+Date.now()}

function load(init){
  if(ld&&!init)return; ld=true;
  if(hp<HI.length-1) HI.length=hp+1;
  var s=D[cur];
  if(s.type==='json'){loadJson(init);return}
  var url=imgUrl();
  var tL=init?aEl():nEl(), tI=init?aIm():nIm(), aL=aEl();
  init?showLoading():showDots();
  var img=new Image();
  var to=setTimeout(function(){img.src='';showError();ld=false},MAX_TO);
  function ok(){
    clearTimeout(to); tI.src=url; currentImgUrl=url; currentMeta=null;
    if(!init){aL.classList.remove('a');tL.classList.add('a');ly=tL.id}
    onImgLoad(tI); hideStatus(); tot++; updateCnt();
    HI.push({u:url,id:cur}); hp=HI.length-1;
    if(HI.length>60){HI.shift();hp--} ld=false; if(at)resumeAuto()
  }
  function no(){clearTimeout(to);
    var ru=imgUrl()+'&_r='+Math.random();
    var i2=new Image();var t2=setTimeout(function(){i2.src='';showError();ld=false},12000);
    i2.onload=function(){clearTimeout(t2);tI.src=ru;currentImgUrl=ru;currentMeta=null;
      if(!init){aL.classList.remove('a');tL.classList.add('a');ly=tL.id}
      onImgLoad(tI);hideStatus();tot++;updateCnt();
      HI.push({u:ru,id:cur});hp=HI.length-1;ld=false;if(at)resumeAuto()};
    i2.onerror=function(){clearTimeout(t2);showError();ld=false;if(at)stopAuto()};
    i2.src=ru
  }
  img.onload=ok; img.onerror=no; img.src=url;
}

function loadJson(init){
  var s=D[cur];
  var tL=init?aEl():nEl(), tI=init?aIm():nIm(), aL=aEl();
  init?showLoading():showDots();
  var to=setTimeout(function(){showError();ld=false},MAX_TO);
  fetch(s.u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.body||{r18:0,num:1,size:['original']})})
  .then(function(r){return r.json()})
  .then(function(data){
    clearTimeout(to);
    if(data.data&&data.data.length>0){
      var item=data.data[0];
      var imgUrl=item.urls.original||item.urls.regular||'';
      if(!imgUrl){showError();ld=false;return}
      var img=new Image();var t2=setTimeout(function(){img.src='';showError();ld=false},12000);
      img.onload=function(){clearTimeout(t2);tI.src=imgUrl;currentImgUrl=imgUrl;currentMeta=item;
        if(!init){aL.classList.remove('a');tL.classList.add('a');ly=tL.id}
        onImgLoad(tI);hideStatus();tot++;updateCnt();
        HI.push({u:imgUrl,id:cur,meta:item});hp=HI.length-1;
        if(HI.length>60){HI.shift();hp--}ld=false;if(at)resumeAuto()};
      img.onerror=function(){clearTimeout(t2);showError();ld=false;if(at)stopAuto()};
      img.src=imgUrl
    }else{showError();ld=false}
  }).catch(function(){clearTimeout(to);showError();ld=false})
}

function goH(d){
  if(ld||!HI.length)return;
  var np=hp+d; if(np<0)return;
  if(np>=HI.length){load();return}
  ld=true; hp=np; var it=HI[hp];
  var tL=nEl(), tI=nIm(), aL=aEl(); showDots();
  var img=new Image();var to=setTimeout(function(){img.src='';ld=false;load()},12000);
  img.onload=function(){clearTimeout(to);tI.src=it.u;currentImgUrl=it.u;currentMeta=it.meta||null;
    aL.classList.remove('a');tL.classList.add('a');ly=tL.id;
    onImgLoad(tI);hideStatus();updateCnt();ld=false;if(at)resumeAuto()};
  img.onerror=function(){clearTimeout(to);ld=false;load()};
  img.src=it.u
}

function onImgLoad(imgEl){
  var w=imgEl.naturalWidth, h=imgEl.naturalHeight, s=D[cur];
  if(w&&h){
    var ratio=h/w;
    stage.classList.remove('portrait','landscape');
    L1.classList.remove('portrait','landscape');L2.classList.remove('portrait','landscape');
    if(ratio>1.25){currentOrientation='portrait';stage.classList.add('portrait');L1.classList.add('portrait');L2.classList.add('portrait')}
    else if(ratio<0.8){currentOrientation='landscape';stage.classList.add('landscape');L1.classList.add('landscape');L2.classList.add('landscape')}
    else{currentOrientation=''}
    infoDims.textContent=w+'×'+h+(currentOrientation?(currentOrientation==='portrait'?' 竖屏':' 横屏'):'');
  }
  infoSrc.textContent=s.n;
  if(currentMeta&&currentMeta.pid){infoPid.textContent='PID: '+currentMeta.pid+'\n'+currentMeta.title}else{infoPid.textContent=''}
  ambient.classList.add('show');
  updateFavIcon()
}

window.doRetry=function(){if(ld)return;HI=[];hp=-1;load(true)}

/* ============================================================
   STATUS
   ============================================================ */
function showLoading(){ldr.classList.remove('h');ldrRing.style.display='block';ldrDots.style.display='none';ldrErr.style.display='none'}
function showDots(){ldr.classList.remove('h');ldrRing.style.display='none';ldrDots.style.display='flex';ldrErr.style.display='none'}
function hideStatus(){ldr.classList.add('h')}
function showError(){ldr.classList.remove('h');ldrRing.style.display='none';ldrDots.style.display='none';ldrErr.style.display='block'}
function updateCnt(){badgeCnt.textContent=tot;badgeCnt.style.transform='scale(1.25)';setTimeout(function(){badgeCnt.style.transform='scale(1)'},180)}

/* ============================================================
   CONTROLS
   ============================================================ */
function toggleFullscreen(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(function(){})}
  else{document.exitFullscreen()}
}
function copyUrl(){
  if(!currentImgUrl){showToast('⚠️ 暂无图片');return}
  copyToClipboard(currentImgUrl,function(){showToast('✅ 已复制图片链接')},function(){showToast('❌ 复制失败')})
}
function doDownload(){
  if(!currentImgUrl){showToast('⚠️ 暂无图片');return}
  showToast('📥 下载中…');
  var imgEl=aIm();
  try{
    var c=document.createElement('canvas');c.width=imgEl.naturalWidth;c.height=imgEl.naturalHeight;
    var ctx=c.getContext('2d');ctx.drawImage(imgEl,0,0);
    c.toBlob(function(blob){
      if(!blob){showToast('⚠️ 无法下载，新窗口打开');setTimeout(function(){window.open(currentImgUrl,'_blank')},300);return}
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;a.download='moe_'+Date.now()+'.jpg';a.click();
      URL.revokeObjectURL(url);showToast('✅ 下载完成')
    },'image/jpeg',0.92)
  }catch(e){showToast('⚠️ 受限制，新窗口打开');setTimeout(function(){window.open(currentImgUrl,'_blank')},300)}
}
function toggleFav(){
  if(!currentImgUrl){showToast('⚠️ 暂无图片');return}
  var idx=favs.findIndex(function(f){return f.u===currentImgUrl});
  if(idx>-1){favs.splice(idx,1);showToast('💔 已取消收藏');favDot.style.display=favs.length?'block':'none'}
  else{
    favs.unshift({u:currentImgUrl,n:D[cur].n,t:Date.now()});
    showToast('💝 已收藏');favDot.style.display='block';spawnHeart()
  }
  if(favs.length>200)favs=favs.slice(0,200);
  localStorage.setItem('mg_favs',JSON.stringify(favs));updateFavIcon()
}
function spawnHeart(){
  var h=document.createElement('div');h.className='heart-particle';h.textContent='💕';
  h.style.left=(40+Math.random()*20)+'%';h.style.top='50%';
  document.body.appendChild(h);setTimeout(function(){h.remove()},900)
}
function updateFavIcon(){
  favDot.style.display=favs.length?'block':'none';
  var icon=$('fav-icon'), isFav=favs.findIndex(function(f){return f.u===currentImgUrl})>-1;
  icon.style.fill=isFav?'var(--accent)':'none';
  icon.style.stroke=isFav?'var(--accent)':'currentColor'
}

function startAuto(){at=true;$('btn-auto').classList.add('accent');$('auto-label').textContent='停止';$('auto-icon').innerHTML='<rect x="5" y="5" width="5" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="5" height="14" rx="1" fill="currentColor" stroke="none"/>';showToast('▶️ 自动播放');resumeAuto()}
function stopAuto(){at=false;$('btn-auto').classList.remove('accent');$('auto-label').textContent='自动';$('auto-icon').innerHTML='<polygon points="7 4 19 12 7 20" fill="currentColor" stroke="none"/>';clearTimeout(atm);atm=null}
function resumeAuto(){clearTimeout(atm);if(at)atm=setTimeout(function(){if(at)load()},AINT)}

function switchSrc(){
  if(ld)return; if(at)stopAuto();
  var i=KS.indexOf(cur);cur=KS[(i+1)%KS.length];updateBadge();
  HI=[];hp=-1;tot=0;updateCnt();I1.src=I2.src='';L1.classList.add('a');L2.classList.remove('a');ly='L1';currentImgUrl='';currentMeta=null;infoOverlay.classList.remove('show');
  load(true);showToast('→ '+D[cur].n)
}
function selectSrc(id){
  if(ld||id===cur)return; if(at)stopAuto();
  cur=id;updateBadge();closeAll();
  HI=[];hp=-1;tot=0;updateCnt();I1.src=I2.src='';L1.classList.add('a');L2.classList.remove('a');ly='L1';currentImgUrl='';currentMeta=null;infoOverlay.classList.remove('show');
  load(true);showToast('→ '+D[cur].n)
}

/* ============================================================
   DRAWERS
   ============================================================ */
function openDrawer(name){
  closeAll();
  if(name==='sources'){buildSourcesPanel();$('drawer-sources').classList.add('show')}
  if(name==='favs'){buildFavsPanel();$('drawer-favs').classList.add('show')}
  overlay.classList.add('show')
}
function closeDrawer(name){
  if(name==='sources')$('drawer-sources').classList.remove('show');
  if(name==='favs')$('drawer-favs').classList.remove('show');
  overlay.classList.remove('show')
}
function closeAll(){
  $('drawer-sources').classList.remove('show');$('drawer-favs').classList.remove('show');
  $('api-modal').classList.remove('show');overlay.classList.remove('show')
}

/* ============================================================
   SOURCES PANEL
   ============================================================ */
function buildSourcesPanel(){
  var grp={};KS.forEach(function(k){var s=D[k];if(!grp[s.c])grp[s.c]=[];grp[s.c].push(k)});
  $('src-count-label').textContent=KS.length+'个';
  var h='';
  CO.forEach(function(cat){
    if(!grp[cat])return;
    var ci=CATS[cat]||{i:'🖼️',c:'#c8a882'};
    h+='<div class="src-group-title" style="color:'+ci.c+'">'+ci.i+' '+cat+'</div><div class="src-grid">';
    grp[cat].forEach(function(k){
      var s=D[k];
      h+='<div class="src-card'+(k===cur?' current':'')+'" onclick="selectSrc(\''+k+'\')"><div class="sc-name"><span class="sc-dot" style="background:'+(ci.c)+'"></span>'+s.n+'</div>';
      h+='<div class="sc-meta"><span>'+s.method+'</span><span>'+s.type+'</span></div>';
      h+='<div class="sc-info">'+(s.u.length>34?s.u.substring(0,32)+'…':s.u)+'</div>';
      h+='<button class="sc-detail" onclick="event.stopPropagation();showApiDetail(\''+k+'\')" title="查看API详情">📋</button></div>';
    });
    h+='</div>';
  });
  $('sources-body').innerHTML=h
}

/* ============================================================
   API DETAIL
   ============================================================ */
function showApiDetail(id){
  var s=D[id]; if(!s)return;
  var ci=CATS[s.c]||{i:'🖼️',c:'#c8a882'};
  var h='<div class="api-title">'+ci.i+' '+s.n+'</div><div class="api-cat">'+s.c+' · '+s.method+' · '+s.type+'</div>';

  // URL
  h+='<div class="api-section"><h4>📡 请求地址</h4><div class="api-code"><span style="color:#e8c86a">'+s.method+'</span> '+s.u+'<button class="copy-inline" onclick="copyBtn(this,\''+s.u.replace(/'/g,"\\'")+'\')">复制</button></div></div>';

  // Description
  h+='<div class="api-section"><h4>📝 说明</h4><div style="font-size:12px;color:var(--sub);line-height:1.6">'+s.desc+'</div></div>';

  // Request body for POST
  if(s.body){
    var bodyStr=JSON.stringify(s.body,null,2);
    h+='<div class="api-section"><h4>📦 请求体 (JSON)</h4><div class="api-code"><button class="copy-inline" onclick="copyBtn(this,\''+JSON.stringify(s.body).replace(/'/g,"\\'")+'\')">复制</button>'+bodyStr+'</div></div>';
    // Full params table
    h+='<div class="api-section"><h4>🔧 完整参数说明</h4><table class="param-table">';
    h+='<tr><td>r18</td><td>0 / 1 / 2</td><td>0=全年龄, 1=R18, 2=混合</td></tr>';
    h+='<tr><td>num</td><td>1 ~ 20</td><td>每次返回图片数量</td></tr>';
    h+='<tr><td>keyword</td><td>string</td><td>关键词搜索，如「初音」「猫耳」</td></tr>';
    h+='<tr><td>tag</td><td>array</td><td>标签组合筛选，如["少女","白丝"]</td></tr>';
    h+='<tr><td>size</td><td>array</td><td>original / regular / small / thumb / mini</td></tr>';
    h+='<tr><td>excludeAI</td><td>boolean</td><td>true=排除AI生成图</td></tr>';
    h+='<tr><td>uid</td><td>array</td><td>画师UID数组，筛选特定画师</td></tr>';
    h+='</table></div>';
    // cURL examples
    var curlAll='curl -X POST "'+s.u+'" -H "Content-Type: application/json" -d \''+JSON.stringify(s.body)+'\'';
    var curlR18='curl -X POST "'+s.u+'" -H "Content-Type: application/json" -d \'{"r18":1,"num":5,"size":["original"]}\'';
    var curlKW='curl -X POST "'+s.u+'" -H "Content-Type: application/json" -d \'{"r18":0,"num":3,"keyword":"初音","size":["original"]}\'';
    h+='<div class="api-section"><h4>💻 cURL 示例</h4>';
    h+='<div style="font-size:9px;color:var(--muted);margin-bottom:4px">全年龄 1张</div><div class="api-code"><button class="copy-inline" onclick="copyBtn(this,\''+curlAll.replace(/'/g,"\\'")+'\')">复制</button>curl -X POST "'+s.u+'" \<br>  -H "Content-Type: application/json" \<br>  -d \''+JSON.stringify(s.body)+'\'</div>';
    h+='<div style="font-size:9px;color:var(--muted);margin:8px 0 4px">R18 5张</div><div class="api-code"><button class="copy-inline" onclick="copyBtn(this,\''+curlR18.replace(/'/g,"\\'")+'\')">复制</button>curl -X POST "'+s.u+'" \<br>  -H "Content-Type: application/json" \<br>  -d \'{"r18":1,"num":5,"size":["original"]}\'</div>';
    h+='<div style="font-size:9px;color:var(--muted);margin:8px 0 4px">关键词搜索 3张</div><div class="api-code"><button class="copy-inline" onclick="copyBtn(this,\''+curlKW.replace(/'/g,"\\'")+'\')">复制</button>curl -X POST "'+s.u+'" \<br>  -H "Content-Type: application/json" \<br>  -d \'{"r18":0,"num":3,"keyword":"初音","size":["original"]}\'</div>';
    h+='</div>';
    // Response format
    h+='<div class="api-section"><h4>📬 响应格式</h4><div class="api-code" style="color:#a8c8a8">{\n  "code": 0,\n  "data": [{\n    "pid": 12345678,\n    "p": 0,\n    "uid": 123456,\n    "title": "作品标题",\n    "author": "画师名",\n    "r18": false,\n    "width": 2366,\n    "height": 4093,\n    "tags": ["tag1","tag2"],\n    "urls": {\n      "original": "https://...",\n      "regular": "https://..."\n    }\n  }]\n}</div></div>';
  }else{
    // cURL GET
    h+='<div class="api-section"><h4>💻 cURL 示例</h4><div class="api-code"><button class="copy-inline" onclick="copyBtn(this,\'curl -L \\"'+s.u+'\\" -o image.jpg\')">复制</button>curl -L "'+s.u+'" -o image.jpg</div></div>';
    // HTML
    h+='<div class="api-section"><h4>🌐 HTML 用法</h4><div class="api-code"><button class="copy-inline" onclick="copyBtn(this,\'<img src=\\"'+s.u+'\\" />\')">复制</button>&lt;img src="'+s.u+'" /&gt;</div></div>';
  }

  // JS fetch example
  if(s.method==='POST'){
    h+='<div class="api-section"><h4>📜 JavaScript fetch</h4><div class="api-code"><button class="copy-inline" onclick="copyBtn(this,\'fetch(\\"'+s.u+'\\",{method:\\"POST\\",headers:{\\"Content-Type\\":\\"application/json\\"},body:JSON.stringify({r18:0,num:1,size:[\\"original\\"]})}).then(r=>r.json()).then(d=>console.log(d.data[0].urls.original))\')">复制</button>fetch("'+s.u+'", {<br>  method: "POST",<br>  headers: {"Content-Type": "application/json"},<br>  body: JSON.stringify({r18:0,num:1,size:["original"]})<br>}).then(r => r.json())<br>  .then(d => console.log(d.data[0].urls.original))</div></div>';
  }

  h+='<div class="close-row"><button onclick="closeApiDetail()">关闭</button></div>';
  $('api-card').innerHTML=h;$('api-modal').classList.add('show');overlay.classList.add('show')
}
function closeApiDetail(){$('api-modal').classList.remove('show');overlay.classList.remove('show')}

/* ============================================================
   FAVORITES
   ============================================================ */
function buildFavsPanel(){
  $('fav-count-label').textContent=favs.length+'张';
  var h='';
  if(!favs.length){h='<div class="fav-empty"><b>💝</b>还没有收藏<br><span style="font-size:11px;color:var(--muted)">浏览图片时点击 ❤ 即可收藏</span></div>'}
  else{
    h+='<div class="fav-actions-bar"><button onclick="copyAllFavs()">📋 复制全部链接</button><button class="danger" onclick="clearFavs()">🗑 清空收藏</button></div>';
    favs.forEach(function(f,i){
      h+='<div class="fav-item"><img class="fav-thumb" src="'+f.u+'" loading="lazy" onerror="this.style.display=\'none\'"><div class="fav-info"><div class="fav-name">'+f.n+'</div><div class="fav-url">'+f.u.substring(0,48)+'…</div></div><div class="fav-actions"><button class="fav-act" title="复制" onclick="copyText(\''+f.u.replace(/'/g,"\\'")+'\')">📋</button><button class="fav-act" title="删除" onclick="removeFav('+i+')" style="color:var(--danger)">✕</button></div></div>';
    })
  }
  $('favs-body').innerHTML=h
}
function copyAllFavs(){
  if(!favs.length){showToast('⚠️ 收藏夹为空');return}
  var urls=favs.map(function(f){return f.u}).join('\n');
  navigator.clipboard.writeText(urls).then(function(){showToast('✅ 已复制 '+favs.length+' 个链接')}).catch(function(){showToast('❌ 复制失败')})
}
function clearFavs(){favs=[];localStorage.setItem('mg_favs',[]);favDot.style.display='none';updateFavIcon();buildFavsPanel();$('fav-count-label').textContent='0张';showToast('🗑 已清空')}
function removeFav(i){favs.splice(i,1);localStorage.setItem('mg_favs',JSON.stringify(favs));favDot.style.display=favs.length?'block':'none';updateFavIcon();buildFavsPanel();$('fav-count-label').textContent=favs.length+'张';showToast('已删除')}

/* ============================================================
   UTILS
   ============================================================ */
function showToast(m){clearTimeout(ttm);toast.textContent=m;toast.classList.add('show');ttm=setTimeout(function(){toast.classList.remove('show')},1800)}
function copyToClipboard(t,ok,fail){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(fail);return}
  try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);ok()}catch(e){fail()}
}
function copyText(t){copyToClipboard(t,function(){showToast('✅ 已复制')},function(){showToast('❌ 复制失败')})}
function copyBtn(btn,t){
  copyToClipboard(t,function(){btn.textContent='已复制';btn.classList.add('copied');setTimeout(function(){btn.textContent='复制';btn.classList.remove('copied')},1500)},function(){showToast('❌ 复制失败')})
}
function toggleHelp(){$('help-modal').classList.toggle('show')}

/* ============================================================
   TOUCH GESTURES
   ============================================================ */
var tx=0,ty=0,lt=0,longPressTimer=null;
function tS(e){
  if(e.target.closest('button,.drawer,.api-modal,.help-modal,.overlay,.topbar,.bottombar,.edge-arrow'))return;
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
  clearTimeout(longPressTimer);longPressTimer=setTimeout(function(){toggleFav()},650)
}
function tE(e){
  clearTimeout(longPressTimer);
  if(e.target.closest('button,.drawer,.api-modal,.help-modal,.overlay,.topbar,.bottombar,.edge-arrow'))return;
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<8&&Math.abs(dy)<8){
    var n=Date.now();if(n-lt<300){toggleFullscreen();lt=0}else{lt=n;if(!at)hp>=HI.length-1?load():goH(1)}
    return
  }
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>45){dx>0?goH(-1):(hp>=HI.length-1?load():goH(1))}
}

/* ============================================================
   BIND
   ============================================================ */
$('btn-fullscreen').onclick=toggleFullscreen;$('btn-copy').onclick=copyUrl;$('btn-download').onclick=doDownload;$('btn-fav').onclick=toggleFav;$('btn-help').onclick=toggleHelp;
$('btn-prev').onclick=function(){goH(-1)};$('btn-next').onclick=function(){hp>=HI.length-1?load():goH(1)};
$('btn-auto').onclick=function(){at?stopAuto():startAuto()};$('btn-switch').onclick=switchSrc;
$('btn-sources').onclick=function(){openDrawer('sources')};$('btn-favs').onclick=function(){openDrawer('favs')};
$('arrow-left').onclick=function(){goH(-1)};$('arrow-right').onclick=function(){hp>=HI.length-1?load():goH(1)};
overlay.onclick=closeAll;
stage.addEventListener('click',function(e){
  if(e.target.closest('button,.drawer,.api-modal,.help-modal,.overlay,.topbar,.bottombar,.edge-arrow'))return;
  showUI();if(!at&&!ld){hp>=HI.length-1?load():goH(1)}
});
stage.addEventListener('touchstart',tS,{passive:false});stage.addEventListener('touchend',tE,{passive:false});
stage.addEventListener('touchmove',function(){clearTimeout(longPressTimer)},{passive:false});
stage.addEventListener('dblclick',function(e){if(!e.target.closest('button'))toggleFullscreen()});

// Mouse hover
stage.addEventListener('mousemove',function(e){
  if(window.innerWidth<769)return;
  var x=e.clientX, w=window.innerWidth;
  document.getElementById('arrow-left').style.opacity=x<80?'0.6':'0.2';
  document.getElementById('arrow-right').style.opacity=x>w-80?'0.6':'0.2';
  var y=e.clientY, h=window.innerHeight;
  infoOverlay.classList.toggle('show',y>h-120)
});

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  switch(e.key){
    case'ArrowRight':e.preventDefault();if(!ld)hp>=HI.length-1?load():goH(1);break;
    case'ArrowLeft':e.preventDefault();if(!ld)goH(-1);break;
    case' ':e.preventDefault();if(!ld&&!at)hp>=HI.length-1?load():goH(1);break;
    case'a':case'A':e.preventDefault();at?stopAuto():startAuto();break;
    case'f':case'F':e.preventDefault();toggleFullscreen();break;
    case'c':case'C':e.preventDefault();copyUrl();break;
    case'd':case'D':e.preventDefault();doDownload();break;
    case's':case'S':e.preventDefault();switchSrc();break;
    case'v':case'V':e.preventDefault();openDrawer('favs');break;
    case'Tab':e.preventDefault();openDrawer('sources');break;
    case'Escape':closeAll();if($('help-modal').classList.contains('show'))toggleHelp();break;
    case'h':case'H':e.preventDefault();toggleHelp();break;
  }
});
$('help-modal').onclick=function(e){if(e.target===$('help-modal'))toggleHelp()};
$('api-modal').onclick=function(e){if(e.target===$('api-modal'))closeApiDetail()};

// Expose
window.selectSrc=selectSrc;window.showApiDetail=showApiDetail;window.closeApiDetail=closeApiDetail;
window.copyText=copyText;window.copyBtn=copyBtn;window.copyAllFavs=copyAllFavs;window.clearFavs=clearFavs;window.removeFav=removeFav;
window.toggleHelp=toggleHelp;window.doRetry=doRetry;window.closeDrawer=closeDrawer;window.closeAll=closeAll;

/* ============================================================
   INIT
   ============================================================ */
updateBadge();updateFavIcon();load(true);showLoading();
showUI();resetUITimer();
console.log('💫 MoeGallery v3 · '+KS.length+' 美少女图源 · Lolicon API v2 · 收藏 · 全屏 · 自适应');
})();
</script>
