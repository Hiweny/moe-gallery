<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#08080c;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:#eee;-webkit-font-smoothing:antialiased}

/* ---- Stage ---- */
.stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.il{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.il img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s ease;pointer-events:none;-webkit-user-drag:none;will-change:opacity}
.il.a{z-index:3}.il.a img{opacity:1}
.il.i{z-index:2}.il.i img{opacity:0}
.il.cv img{object-fit:cover}

/* ---- Status ---- */
.sts{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;transition:opacity .3s}.sts.h{opacity:0}
.sp{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:#e84393;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dt{display:flex;gap:6px;margin-top:16px}.dt i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);animation:dt 1.2s ease-in-out infinite}.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,80%,100%{transform:scale(.4);opacity:.2}40%{transform:scale(1);opacity:1}}
.er{text-align:center;color:rgba(255,255,255,.5);font-size:13px;line-height:1.7}
.er b{font-size:40px;display:block;margin-bottom:8px;opacity:.5}
.er button{margin-top:12px;padding:8px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-size:12px;cursor:pointer;pointer-events:auto;transition:all .15s}
.er button:active{transform:scale(.92);background:rgba(255,255,255,.15)}

/* ---- Glass ---- */
.g{background:rgba(12,12,20,.55);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.07)}

/* ---- Top Bar ---- */
.tb{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,8px)+6px) 12px 6px;pointer-events:none}
.tb>*{pointer-events:auto}
.badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;font-size:11px;font-weight:500;color:rgba(255,255,255,.55);max-width:55vw;overflow:hidden}
.badge .n{font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge .c{color:#fff;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;transition:transform .15s cubic-bezier(.18,.89,.32,1.28)}
.badge .u{color:rgba(255,255,255,.3);font-size:10px}
.acts{display:flex;gap:5px}
.ib{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:#fff;flex-shrink:0}
.ib:active{transform:scale(.85);background:rgba(255,255,255,.15)!important}
.ib.on{background:#e84393!important;border-color:#e84393!important;box-shadow:0 0 14px rgba(232,67,147,.35)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Bottom Bar ---- */
.bb{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 10px calc(env(safe-area-inset-bottom,8px)+6px);pointer-events:none;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bb::-webkit-scrollbar{display:none}
.bb>*{pointer-events:auto;flex-shrink:0}
.pb{display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;color:#fff}
.pb:active{transform:scale(.92);background:rgba(255,255,255,.12)!important}
.pb.act{background:#e84393!important;border-color:#e84393!important;box-shadow:0 0 18px rgba(232,67,147,.3);color:#fff!important}
.pb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Source Panel ---- */
.mk{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}.mk.s{opacity:1;pointer-events:auto}
.pn{position:fixed;bottom:0;left:0;right:0;z-index:26;max-height:70vh;width:100%;background:rgba(14,14,22,.96);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,.06);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);padding:16px 14px calc(env(safe-area-inset-bottom,8px)+14px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pn.s{transform:translateY(0)}
.pn h3{font-size:15px;font-weight:600;margin-bottom:3px}
.pn .s2{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:12px}
.cl{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px;padding-left:2px}.cl:first-of-type{margin-top:0}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:4px}
.sc{padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.04);cursor:pointer;transition:all .15s;overflow:hidden}
.sc:active{transform:scale(.96);background:rgba(255,255,255,.08)}
.sc.cu{border-color:rgba(232,67,147,.4);background:rgba(232,67,147,.06)}
.sc .sn{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .si{font-size:9px;margin-top:2px}

/* ---- Arrows ---- */
.ar{position:fixed;top:50%;z-index:20;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;transform:translateY(-50%);opacity:0;pointer-events:none;color:#fff}
.ar:hover{opacity:1;box-shadow:0 0 20px rgba(0,0,0,.5)}.ar:active{transform:translateY(-50%) scale(.85)}
.ar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ar.l{left:12px}.ar.r{right:12px}
@media(min-width:769px){.ar{opacity:.3;pointer-events:auto}}

/* ---- Toast ---- */
.tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(12px);z-index:30;padding:8px 16px;border-radius:16px;font-size:11px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;color:#fff;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
.tt.s{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Help ---- */
.hp{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}.hp.s{opacity:1;pointer-events:auto}
.hc{padding:22px 20px 16px;max-width:320px;width:88%;text-align:center;border-radius:20px;overflow:hidden}
.hc h3{font-size:16px;margin-bottom:12px}
.hc .ks{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;text-align:left;font-size:11px;color:rgba(255,255,255,.5);margin-bottom:14px}
.hc kbd{display:inline-block;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.07);font-size:10px;font-family:'SF Mono',monospace;color:#fff;border:1px solid rgba(255,255,255,.1);text-align:center;min-width:22px}
.hc button{padding:8px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-size:12px;cursor:pointer;transition:all .15s}.hc button:active{transform:scale(.92)}
.hc p{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:12px}

/* ---- Mobile: extra small ---- */
@media(max-width:374px){
  .pb{padding:4px 7px;font-size:9px;gap:2px}.bb{gap:3px}
  .pb svg{width:12px;height:12px}
  .badge{padding:4px 7px;font-size:9px;gap:3px;max-width:50vw}
  .badge .c{font-size:11px}
  .ib{width:28px;height:28px}.ib svg{width:12px;height:12px}
  .acts{gap:3px}
  .sg{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px}
  .sc{padding:6px}.sc .sn{font-size:10px}.sc .si{font-size:8px}
  .pn{padding:12px 10px calc(env(safe-area-inset-bottom,8px)+10px)}
  .hc{padding:16px 14px 12px}
}
/* ---- Mobile: small ---- */
@media(min-width:375px) and (max-width:480px){
  .ib{width:30px;height:30px}.ib svg{width:14px;height:14px}
  .pb{padding:5px 9px;font-size:10px;gap:3px}.bb{gap:4px}
  .badge{padding:5px 9px;font-size:10px;gap:4px;max-width:55vw}
  .badge .c{font-size:12px}
  .acts{gap:4px}
  .sg{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px}
  .sc{padding:8px}.sc .sn{font-size:11px}
}
/* ---- Mobile: medium ---- */
@media(min-width:481px) and (max-width:768px){
  .sg{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
/* ---- Safe area for notch phones ---- */
@supports(padding:env(safe-area-inset-top)){
  .tb{padding-top:calc(env(safe-area-inset-top) + 8px)}
  .bb{padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
  .pn{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
}
</style>
</head>

var I1=$('I1'),I2=$('I2'),L1=$('L1'),L2=$('L2'),sts=$('sts'),sp=$('sp'),dt=$('dt'),er=$('er');
var cnt=$('cnt'),sI=$('sI'),sN=$('sN');
var bF=$('bF'),bD=$('bD'),bH=$('bH'),bP=$('bP'),bN=$('bN'),bA=$('bA'),bS=$('bS'),bL=$('bL');
var aI=$('aI'),aL=$('aL'),aR=$('aR'),mk=$('mk'),pn=$('pn'),pl=$('pl'),hp=$('hp'),tt=$('tt');

function iLy(){return ly==='L1'?'L2':'L1'}
function iL(){return ly}
function aEl(){return ly==='L1'?L1:L2}
function nEl(){return ly==='L1'?L2:L1}
function aIm(){return ly==='L1'?I1:I2}
function nIm(){return ly==='L1'?I2:I1}

/* ========== CORE ========== */
function updBdg(){
  var s=D[cur],ci=CATS[s.c]||{i:'🖼️',c:'#e84393'};
  sI.textContent=ci.i;sN.textContent=s.n;
  document.querySelectorAll('.sc').forEach(function(e){e.classList.toggle('cu',e.dataset.id===cur)});
}
function aUrl(){
  var b=D[cur].u;
  return b+(b.indexOf('?')>-1?'&':'?')+'_t='+Date.now();
}
function load(init){
  if(ld&&!init)return;ld=true;
  if(hp<HI.length-1)HI.length=hp+1;
  var url=aUrl();
  var tL=init?aEl():nEl(),tI=init?aIm():nIm(),aL=aEl();
  init?sL():sD();
  var img=new Image();img.crossOrigin='anonymous';
  var to=setTimeout(function(){img.src='';sE();ld=false},16000);
  function ok(){clearTimeout(to);tI.src=url;
    if(!init){aL.classList.remove('a');aL.classList.add('i');tL.classList.remove('i');tL.classList.add('a');ly=tL.id}
    hS();tot++;uCnt();HI.push({u:url,id:cur});hp=HI.length-1;
    if(HI.length>60){HI.shift();hp--}ld=false;if(at)rAt()}
  function no(){clearTimeout(to);var ru=D[cur].u+(D[cur].u.indexOf('?')>-1?'&':'?')+'_r='+Date.now();
    var i2=new Image();i2.crossOrigin='anonymous';
    var t2=setTimeout(function(){i2.src='';sE();ld=false},12000);
    i2.onload=function(){clearTimeout(t2);tI.src=ru;
      if(!init){aL.classList.remove('a');aL.classList.add('i');tL.classList.remove('i');tL.classList.add('a');ly=tL.id}
      hS();tot++;uCnt();HI.push({u:ru,id:cur});hp=HI.length-1;ld=false;if(at)rAt()};
    i2.onerror=function(){clearTimeout(t2);sE();ld=false;if(at)stA()};
    i2.src=ru}
  img.onload=ok;img.onerror=no;img.src=url;
}
function goH(d){
  if(ld||!HI.length)return;
  var np=hp+d;if(np<0)return;
  if(np>=HI.length){load();return}
  ld=true;hp=np;var it=HI[hp];
  var tL=nEl(),tI=nIm(),aL=aEl();sD();
  var img=new Image();img.crossOrigin='anonymous';
  var to=setTimeout(function(){img.src='';ld=false;load()},12000);
  img.onload=function(){clearTimeout(to);tI.src=it.u;aL.classList.remove('a');aL.classList.add('i');tL.classList.remove('i');tL.classList.add('a');ly=tL.id;hS();uCnt();ld=false;if(at)rAt()};
  img.onerror=function(){clearTimeout(to);ld=false;load()};
  img.src=it.u;
}
window.doRetry=function(){if(ld)return;HI=[];hp=-1;load(true)};

/* ========== STATUS ========== */
function sL(){sts.classList.remove('h');sp.style.display='block';dt.style.display='none';er.style.display='none'}
function sD(){sts.classList.remove('h');sp.style.display='none';dt.style.display='flex';er.style.display='none'}
function hS(){sts.classList.add('h')}
function sE(){sts.classList.remove('h');sp.style.display='none';dt.style.display='none';er.style.display='block'}
function uCnt(){cnt.textContent=tot;cnt.style.transform='scale(1.15)';setTimeout(function(){cnt.style.transform='scale(1)'},150)}

/* ========== CONTROLS ========== */
function tCv(){cv=!cv;L1.classList.toggle('cv',cv);L2.classList.toggle('cv',cv);bF.classList.toggle('on',cv);tT(cv?'📐 填充':'📐 适应')}
async function dl(){
  var img=aIm();if(!img.src||img.src===location.href){tT('⚠️ 暂无图片');return}
  tT('📥 下载中...');
  try{var r=await fetch(img.src,{mode:'cors'});var b=await r.blob();var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=D[cur].n+'-'+Date.now()+'.jpg';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);tT('✅ 已下载')}
  catch{tT('🔗 新窗口打开...');setTimeout(function(){window.open(img.src,'_blank')},300)}
}
function stA(){at=true;bA.classList.add('act');aL.textContent='停止';aI.innerHTML='<rect x="5" y="5" width="5" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="5" height="14" rx="1" fill="currentColor" stroke="none"/>';tT('▶️ 自动播放');rAt()}
function stp(){at=false;bA.classList.remove('act');aL.textContent='自动';aI.innerHTML='<polygon points="7 4 19 12 7 20" fill="currentColor" stroke="none"/>';clearTimeout(atm);atm=null;tT('⏸ 已暂停')}
function rAt(){clearTimeout(atm);if(at)atm=setTimeout(function(){if(at)load()},AINT)}
function sSrc(){
  if(ld)return;if(at)stp();
  var i=KS.indexOf(cur);cur=KS[(i+1)%KS.length];updBdg();
  HI=[];hp=-1;tot=0;uCnt();
  I1.src=I2.src='';L1.classList.add('a');L1.classList.remove('i');L2.classList.remove('a');L2.classList.add('i');ly='L1';
  load(true);tT('切换至 '+D[cur].n);
}
function selSrc(id){
  if(ld||id===cur)return;if(at)stp();
  cur=id;updBdg();cP();
  HI=[];hp=-1;tot=0;uCnt();
  I1.src=I2.src='';L1.classList.add('a');L1.classList.remove('i');L2.classList.remove('a');L2.classList.add('i');ly='L1';
  load(true);tT('切换至 '+D[cur].n);
}
function tP(){var s=!pn.classList.contains('s');pn.classList.toggle('s',s);mk.classList.toggle('s',s)}
function cP(){pn.classList.remove('s');mk.classList.remove('s')}
function tT(m){clearTimeout(ttm);tt.textContent=m;tt.classList.add('s');ttm=setTimeout(function(){tt.classList.remove('s')},1400)}
function tH(){hp.classList.toggle('s')}

/* ========== PANEL ========== */
function bldP(){
  var grp={};KS.forEach(function(k){var s=D[k];if(!grp[s.c])grp[s.c]=[];grp[s.c].push(k)});
  var h='';
  CO.forEach(function(cat){
    if(!grp[cat])return;
    var ci=CATS[cat]||{i:'🖼️',c:'#e84393'};
    h+='<div class="cl" style="color:'+ci.c+'">'+ci.i+' '+cat+'</div><div class="sg">';
    grp[cat].forEach(function(k){
      h+='<div class="sc'+(k===cur?' cu':'')+'" data-id="'+k+'" onclick="selSrc(\''+k+'\')"><div class="sn">'+D[k].n+'</div><div class="si">'+(D[k].u.length>38?D[k].u.substring(0,36)+'…':D[k].u)+'</div></div>';
    });
    h+='</div>';
  });
  pl.innerHTML=h;
}
bldP();

/* ========== TOUCH ========== */
var tx=0,ty=0,lt=0;
function tS(e){if(e.target.closest('button,.pn,.hp,.mk,.sts,.ar,.tb,.bb,.badge'))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY}
function tE(e){
  if(e.target.closest('button,.pn,.hp,.mk,.sts,.ar,.tb,.bb,.badge'))return;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<10&&Math.abs(dy)<10){var n=Date.now();if(n-lt<300){tCv();lt=0}else{lt=n;if(!at)load()}return}
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){dx>0?goH(-1):(hp>=HI.length-1?load():goH(1))}
}

/* ========== BIND ========== */
bF.onclick=tCv;bD.onclick=dl;bH.onclick=tH;
bP.onclick=function(){goH(-1)};bN.onclick=function(){hp>=HI.length-1?load():goH(1)};
bA.onclick=function(){at?stp():stA()};bS.onclick=sSrc;bL.onclick=tP;
mk.onclick=cP;
$('aL').onclick=function(){goH(-1)};$('aR').onclick=function(){hp>=HI.length-1?load():goH(1)};
$('stage').onclick=function(e){if(e.target.closest('button,.pn,.hp,.mk,.sts,.ar,.tb,.bb,.badge'))return;if(!at&&!ld){hp>=HI.length-1?load():goH(1)}};
$('stage').addEventListener('touchstart',tS,{passive:false});
$('stage').addEventListener('touchend',tE,{passive:false});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  switch(e.key){
    case'ArrowRight':e.preventDefault();if(!ld)hp>=HI.length-1?load():goH(1);break;
    case'ArrowLeft':e.preventDefault();if(!ld)goH(-1);break;
    case' ':e.preventDefault();if(!ld&&!at)hp>=HI.length-1?load():goH(1);break;
    case'a':case'A':e.preventDefault();at?stp():stA();break;
    case'f':case'F':e.preventDefault();tCv();break;
    case'd':case'D':e.preventDefault();dl();break;
    case's':case'S':e.preventDefault();sSrc();break;
    case'Tab':e.preventDefault();tP();break;
    case'Escape':if(hp.classList.contains('s'))hp.classList.remove('s');else if(pn.classList.contains('s'))cP();break;
    case'h':case'H':e.preventDefault();tH();break;
  }
});
hp.onclick=function(e){if(e.target===hp)hp.classList.remove('s')};
window.selSrc=selSrc;window.togH=tH;window.doRetry=doRetry;

updBdg();load(true);sL();
console.log('🖼️ MoeGallery · '+KS.length+' 源就绪');
})();
</script>
</body>
</html>
