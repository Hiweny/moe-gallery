<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080d">
<meta name="description" content="21个精选美少女图源 · 二次元 · 写真 · JK · 白丝 · Pixiv">
<title>MoeGallery · 美少女画廊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💫</text></svg>">
<style>
/* ============================================================
   DESIGN TOKENS — "Velvet Noir"
   ============================================================ */
:root{
  --bg: #08080d;
  --bg2: #0e0e16;
  --surface: rgba(16,16,28,.88);
  --surface2: rgba(22,22,38,.7);
  --border: rgba(255,255,255,.05);
  --border2: rgba(255,255,255,.03);
  --text: #e8e4df;
  --text2: rgba(232,228,223,.65);
  --muted: rgba(255,255,255,.24);
  --muted2: rgba(255,255,255,.1);
  --accent: #c8a882;
  --accent2: #a89bb8;
  --accent-glow: rgba(200,168,130,.12);
  --danger: #e0556a;
  --success: #5dae8b;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --font-heading: 'Noto Serif SC','Source Han Serif SC','STSong','Songti SC',serif;
  --font-body: 'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,-apple-system,sans-serif;
  --font-mono: 'SF Mono','JetBrains Mono','Fira Code','Cascadia Code',monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --ease-smooth: cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(168,155,184,.02) 0%,transparent 55%),radial-gradient(ellipse at 80% 100%,rgba(200,168,130,.015) 0%,transparent 45%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.025'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

/* ============================================================
   PAGES CONTAINER
   ============================================================ */
.pages{position:fixed;inset:0;z-index:1}
.page{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s var(--ease-smooth),transform .35s var(--ease-out)}
.page.active{opacity:1;pointer-events:auto;transform:translateY(0) translateX(0)}
.page.enter-from-right{transform:translateX(36px)}
.page.enter-from-left{transform:translateX(-36px)}
.page.enter-from-bottom{transform:translateY(36px)}

/* ============================================================
   PAGE: VIEWER (Browse)
   ============================================================ */
.page-viewer{background:transparent}

/* Stage */
.viewer-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.viewer-stage.mode-portrait{align-items:center;justify-content:center}
.viewer-stage.mode-landscape{align-items:center;justify-content:center}

/* Orientation badge */
.orient-badge{position:absolute;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%);z-index:6;padding:6px 14px;border-radius:16px;font-size:10px;font-weight:500;letter-spacing:.5px;opacity:0;pointer-events:none;transition:opacity .4s ease;color:var(--text2);background:rgba(16,16,28,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border)}
.orient-badge.show{opacity:1;animation:orientFade 2s ease forwards}
@keyframes orientFade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* Image layers */
.img-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .5s var(--ease-out)}
.img-layer img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .6s var(--ease-out),transform .6s var(--ease-out);pointer-events:none;-webkit-user-drag:none;will-change:opacity,transform;transform:scale(1.04)}
.img-layer.active{z-index:3}.img-layer.active img{opacity:1;transform:scale(1)}
.img-layer.portrait img{max-height:calc(100vh - 180px);max-width:100vw}
.img-layer.landscape img{max-width:100vw;max-height:calc(100vh - 60px)}

/* Ambient glow */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1s ease}
.ambient.show{opacity:1}
.ambient .orb{position:absolute;width:50vmax;height:50vmax;border-radius:50%;filter:blur(100px);opacity:.08;transform:translate(-50%,-50%);transition:left .8s ease,top .8s ease}
.ambient .orb:nth-child(1){left:50%;top:50%;background:var(--accent)}
.ambient .orb:nth-child(2){left:50%;top:50%;background:var(--accent2);width:35vmax;height:35vmax;opacity:.05}

/* Info overlay */
.info-overlay{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:24px 24px calc(var(--safe-bottom) + 24px);background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;pointer-events:none;transition:opacity .5s ease;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.info-overlay.show{opacity:1}
.info-left{font-size:11px;color:rgba(255,255,255,.4);line-height:1.7}
.info-left b{color:rgba(255,255,255,.7);font-weight:500;font-family:var(--font-heading);font-size:13px}
.info-right{font-size:10px;color:rgba(255,255,255,.3);text-align:right;line-height:1.6}

/* Loading */
.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;transition:opacity .4s}
.loader.hidden{opacity:0}
.loader-ring{width:40px;height:40px;border:2px solid var(--muted2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-dots{display:none;gap:7px;margin-top:18px}
.loader-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);animation:dot 1.2s ease-in-out infinite}
.loader-dots i:nth-child(2){animation-delay:.15s}i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.3);opacity:.08}40%{transform:scale(1);opacity:1}}
.loader-error{display:none;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.loader-error b{font-size:44px;display:block;margin-bottom:10px;opacity:.25}
.loader-error button{margin-top:14px;padding:12px 32px;border-radius:24px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;pointer-events:auto;transition:all .15s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-family:var(--font-body)}
.loader-error button:active{transform:scale(.92);background:rgba(255,255,255,.06)}

/* Top bar */
.viewer-topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 10px) 16px 10px;pointer-events:none;gap:12px;transition:opacity .4s ease,transform .4s var(--ease-out)}
.viewer-topbar.hidden{opacity:0;transform:translateY(-20px);pointer-events:none}
.viewer-topbar>*{pointer-events:auto}
.src-badge{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:24px;font-size:12px;font-weight:500;color:var(--text2);max-width:50vw;overflow:hidden;flex-shrink:1;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);background:rgba(16,16,28,.82);border:1px solid var(--border)}
.src-badge .si{font-size:17px;flex-shrink:0}
.src-badge .sn{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-badge .cnt{color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;transition:transform .15s var(--ease-spring)}
.viewer-actions{display:flex;gap:16px;flex-shrink:0}
.vbtn{width:48px;height:48px;min-width:48px;min-height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--text);flex-shrink:0;background:rgba(16,16,28,.82);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border);outline:none;position:relative}
.vbtn:active{transform:scale(.82);background:rgba(255,255,255,.08)}
.vbtn.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 24px var(--accent-glow)}
.vbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtn .badge-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}

/* Bottom bar */
.viewer-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 14px calc(var(--safe-bottom) + 10px);pointer-events:none;transition:opacity .4s ease,transform .4s var(--ease-out);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.viewer-bottombar::-webkit-scrollbar{display:none}
.viewer-bottombar.hidden{opacity:0;transform:translateY(20px);pointer-events:none}
.viewer-bottombar>*{pointer-events:auto;flex-shrink:0}
.nbtn{display:flex;align-items:center;gap:8px;padding:16px 26px;min-height:48px;border-radius:26px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;color:var(--text);background:rgba(16,16,28,.82);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border);outline:none;font-family:var(--font-body)}
.nbtn:active{transform:scale(.9);background:rgba(255,255,255,.05)}
.nbtn.accent{background:var(--accent);border-color:var(--accent);color:#1a1a1a;font-weight:600;box-shadow:0 0 28px rgba(200,168,130,.2)}
.nbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Edge arrows */
.edge-arrow{position:absolute;top:50%;z-index:20;width:48px;height:48px;min-width:48px;min-height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;transform:translateY(-50%);opacity:0;pointer-events:none;color:var(--text);background:rgba(16,16,28,.82);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border);outline:none}
.edge-arrow:active{transform:translateY(-50%) scale(.82)}
.edge-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.edge-arrow.left{left:16px}.edge-arrow.right{right:16px}
@media(min-width:769px){.edge-arrow{opacity:.2;pointer-events:auto}.edge-arrow:hover{opacity:1}}

/* ============================================================
   TOAST
   ============================================================ */
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(10px);z-index:50;padding:12px 26px;border-radius:26px;font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s var(--ease-spring);white-space:nowrap;color:var(--text);max-width:85vw;overflow:hidden;text-overflow:ellipsis;background:var(--surface);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* SW status prompt */
.sw-status{position:fixed;bottom:50%;left:50%;transform:translate(-50%,50%);z-index:55;padding:16px 28px;border-radius:20px;text-align:center;font-size:13px;line-height:1.8;color:var(--text);background:var(--surface);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border);display:none}
.sw-status.show{display:block}
.sw-status .sw-spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--muted2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:6px}
.sw-status button{margin-top:10px;padding:10px 28px;border-radius:20px;border:1px solid var(--accent);background:rgba(200,168,130,.1);color:var(--accent);font-size:12px;cursor:pointer;font-family:var(--font-body);transition:all .15s}
.sw-status button:active{transform:scale(.92)}

/* ============================================================
   BOTTOM TAB BAR
   ============================================================ */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(var(--safe-bottom) + 6px);background:rgba(8,8,14,.94);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-top:1px solid var(--border)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 14px;border-radius:14px;cursor:pointer;transition:all .15s;color:var(--muted);background:transparent;border:none;outline:none;font-family:var(--font-body);min-width:60px;min-height:48px;position:relative}
.tab:active{color:var(--text);background:rgba(255,255,255,.03)}
.tab.active{color:var(--accent)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:500}
.tab .tab-badge{position:absolute;top:4px;right:calc(50% - 20px);width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
.tab .tab-badge.show{display:block}

/* ============================================================
   PAGE: SOURCES
   ============================================================ */
.page-sources{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page-sources::-webkit-scrollbar{width:3px}.page-sources::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px}
.sources-header{position:sticky;top:0;z-index:5;padding:calc(var(--safe-top) + 20px) 20px 14px;background:linear-gradient(var(--bg),var(--bg) 60%,transparent);display:flex;align-items:center;justify-content:space-between}
.sources-header h2{font-family:var(--font-heading);font-size:24px;font-weight:600;letter-spacing:.5px}
.sources-header .src-count{font-size:12px;color:var(--muted)}

.cat-filters{display:flex;gap:10px;padding:10px 20px 18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-filters::-webkit-scrollbar{display:none}
.cat-pill{padding:10px 22px;border-radius:24px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);outline:none;font-family:var(--font-body);min-height:44px}
.cat-pill:active{transform:scale(.94)}
.cat-pill.active{background:var(--accent);border-color:var(--accent);color:#1a1a1a;font-weight:600}

.src-section{padding:0 20px;margin-bottom:8px}
.src-section-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 12px 4px;display:flex;align-items:center;gap:8px}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.src-card{padding:16px 18px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border2);cursor:pointer;transition:all .18s;overflow:hidden;position:relative}
.src-card:active{transform:scale(.95);background:rgba(255,255,255,.05)}
.src-card.current{border-color:rgba(200,168,130,.3);background:rgba(200,168,130,.03)}
.src-card .sc-name{font-size:14px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.src-card .sc-name .sc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.src-card .sc-meta{font-size:9px;color:var(--muted);display:flex;gap:6px;margin-bottom:4px}
.src-card .sc-meta span{padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.04);font-family:var(--font-mono);font-size:8px}
.src-card .sc-url{font-size:9px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-card .sc-detail{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;background:rgba(255,255,255,.03);border:none;outline:none;opacity:0}
.src-card:active .sc-detail,.src-card:hover .sc-detail{opacity:1}

@media(max-width:374px){.src-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.src-card{padding:12px 14px}.src-card .sc-name{font-size:12px}}
@media(min-width:769px){.src-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.src-card:hover .sc-detail{opacity:1}}

/* ============================================================
   PAGE: FAVORITES
   ============================================================ */
.page-favs{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page-favs::-webkit-scrollbar{width:3px}.page-favs::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px}
.favs-header{position:sticky;top:0;z-index:5;padding:calc(var(--safe-top) + 20px) 20px 14px;background:linear-gradient(var(--bg),var(--bg) 60%,transparent);display:flex;align-items:center;justify-content:space-between}
.favs-header h2{font-family:var(--font-heading);font-size:24px;font-weight:600;letter-spacing:.5px}
.favs-actions{display:flex;gap:10px}
.favs-actions button{padding:10px 18px;border-radius:22px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);outline:none;font-family:var(--font-body);min-height:44px}
.favs-actions button:active{transform:scale(.93)}
.favs-actions button.danger{color:var(--danger);border-color:rgba(224,85,106,.15)}

/* Favorites grid — larger images, 2/3 aspect ratio */
.favs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px calc(var(--safe-bottom) + 80px)}
.fav-card{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface2);border:1px solid var(--border2);cursor:pointer;transition:all .18s;aspect-ratio:2/3;min-height:200px}
.fav-card:active{transform:scale(.96)}
.fav-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.fav-card:hover img{transform:scale(1.06)}
.fav-card .fav-overlay{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.fav-card .fav-name{font-size:12px;font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-card .fav-date{font-size:9px;color:rgba(255,255,255,.45);margin-top:2px}
.fav-card .fav-remove{width:32px;height:32px;min-width:32px;min-height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .15s;color:#fff;background:rgba(0,0,0,.45);border:none;outline:none;font-size:13px}
.fav-card .fav-remove:active{background:var(--danger);transform:scale(.85)}

.fav-empty{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px}
.fav-empty b{font-size:56px;display:block;margin-bottom:14px;opacity:.2}

@media(min-width:481px){.favs-grid{grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px calc(var(--safe-bottom) + 80px)}}
@media(min-width:769px){.favs-grid{grid-template-columns:repeat(4,1fr);gap:18px;padding:0 24px calc(var(--safe-bottom) + 80px)}}
@media(min-width:1025px){.favs-grid{grid-template-columns:repeat(5,1fr)}}

/* ============================================================
   PAGE: DOCS
   ============================================================ */
.page-docs{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page-docs::-webkit-scrollbar{width:3px}.page-docs::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px}
.docs-header{position:sticky;top:0;z-index:5;padding:calc(var(--safe-top) + 20px) 20px 14px;background:linear-gradient(var(--bg),var(--bg) 60%,transparent)}
.docs-header h2{font-family:var(--font-heading);font-size:24px;font-weight:600;letter-spacing:.5px}
.docs-intro{padding:0 20px 18px;font-size:13px;color:var(--text2);line-height:1.8}
.docs-section{padding:0 20px;margin-bottom:28px}
.docs-section h3{font-size:17px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-family:var(--font-heading)}
.docs-code{position:relative;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;padding:16px 18px;padding-right:90px;font-family:var(--font-mono);font-size:11px;line-height:1.8;color:#a8c8a8;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin-bottom:12px}

function load(init){
  if(ld&&!init)return; ld=true;

    }

  }
  var url=imgUrl();
  var tL=init?aEl():nEl(), tI=init?aIm():nIm(), aL=aEl();
  init?showLoading():showDots();
  var img=new Image();

  function ok(){
    clearTimeout(to); tI.src=url;

function showSWWaiting(){

    }
  }).catch(function(){

  });

function loadJson(init){
  var s=getSrc(cur);
  var tL=init?aEl():nEl(), tI=init?aIm():nIm(), aL=aEl();
  init?showLoading():showDots();

  function doFetch(){
    var to=setTimeout(function(){showError('API请求超时');ld=false},MAX_TO);
    var headers={'Content-Type':'application/json'};
    var body=JSON.stringify(s.body||{r18:0,num:1,size:['original']});
    fetch(s.u,{method:'POST',headers:headers,body:body})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(data){
      clearTimeout(to);
      if(data.error&&data.error!==''){showError('API错误: '+data.error);ld=false;return}
      if(data.data&&data.data.length>0){
        var item=data.data[0];
        var imgUrl=item.urls.original||item.urls.regular||'';
        if(!imgUrl){showError('无图片URL');ld=false;return}
        var img=new Image();var t2=setTimeout(function(){img.src='';showError('图片加载超时');ld=false},12000);
        img.onload=function(){clearTimeout(t2);tI.src=imgUrl;
          currentImgUrl=tI.currentSrc||tI.src||imgUrl;currentMeta=item;currentThumb=currentImgUrl;
          if(!init){aL.classList.remove('active');tL.classList.add('active');ly=tL.id}
          onImgLoad(tI);hideStatus();tot++;updateCnt();
          HI.push({u:currentImgUrl,id:cur,meta:item,thumb:currentImgUrl});hp=HI.length-1;
          if(HI.length>60){HI.shift();hp--}ld=false;if(at)resumeAuto()};
        img.onerror=function(){clearTimeout(t2);showError('图片加载失败');ld=false;if(at)stopAuto()};
        img.src=imgUrl
      }else{showError('API返回空数据');ld=false}
    }).catch(function(e){
      clearTimeout(to);
      // Service Worker may not be active on first load — wait and retry
      if('serviceWorker' in navigator && !navigator.serviceWorker.controller){
        showToast('⏳ 等待 Service Worker 激活…');
        navigator.serviceWorker.ready.then(function(){
          if(navigator.serviceWorker.controller){
            showToast('✅ 代理已激活，重试中…');
            swReady=true;
            doFetch();
          }else{
            showError('Service Worker 未控制页面，请刷新后重试');ld=false;
          }
        }).catch(function(){
          showError('Service Worker 激活失败，请刷新页面重试');ld=false;
        });
      }else{
        showError('请求失败: '+(e.message||'网络错误，请刷新页面后重试'));ld=false;
      }
    })
  }
  doFetch();
}

function goH(d){
  if(ld||!HI.length)return;
  var np=hp+d; if(np<0)return;
  if(np>=HI.length){load();return}
  ld=true; hp=np; var it=HI[hp];
  // Restore source if different
  if(it.id&&it.id!==cur){cur=it.id;updateBadge();applySourceOrientation()}
  var tL=nEl(), tI=nIm(), aL=aEl(); showDots();
  var img=new Image();var to=setTimeout(function(){img.src='';ld=false;load()},12000);
  img.onload=function(){clearTimeout(to);tI.src=it.u;
    currentImgUrl=tI.currentSrc||tI.src||it.u;currentMeta=it.meta||null;currentThumb=it.thumb||it.u;
    aL.classList.remove('active');tL.classList.add('active');ly=tL.id;
    onImgLoad(tI);hideStatus();updateCnt();ld=false;if(at)resumeAuto()};
  img.onerror=function(){clearTimeout(to);ld=false;load()};
  img.src=it.u
}

function onImgLoad(imgEl){
  var w=imgEl.naturalWidth, h=imgEl.naturalHeight, s=getSrc(cur);
  if(w&&h){
    var ratio=h/w;
    // Auto-detect orientation from image if source doesn't specify
    if(!s.orient||s.orient===''){
      stage.classList.remove('mode-portrait','mode-landscape');
      L1.classList.remove('portrait','landscape');L2.classList.remove('portrait','landscape');
      if(ratio>1.25){currentOrientation='portrait';stage.classList.add('mode-portrait');L1.classList.add('portrait');L2.classList.add('portrait');showOrientBadge('📱 自动检测: 竖屏')}
      else if(ratio<0.8){currentOrientation='landscape';stage.classList.add('mode-landscape');L1.classList.add('landscape');L2.classList.add('landscape');showOrientBadge('🖥 自动检测: 横屏')}
      else{currentOrientation=''}
    }else{
      currentOrientation=s.orient;
    }
    infoDims.textContent=w+'×'+h+(currentOrientation?(currentOrientation==='portrait'?' 竖屏':' 横屏'):'');
  }
  infoSrc.textContent=s.n;
  if(currentMeta&&currentMeta.pid){infoPid.textContent='PID: '+currentMeta.pid+'\n'+currentMeta.title+' / '+currentMeta.author}else{infoPid.textContent=''}
  ambient.classList.add('show');
  updateFavIcon()
}

function doDownload(){
  if(!currentImgUrl){showToast('⚠️ 暂无图片');return}
  showToast('📥 下载中…');
  var imgEl=aIm();
  try{
    var c=document.createElement('canvas');c.width=imgEl.naturalWidth;c.height=imgEl.naturalHeight;
    var ctx=c.getContext('2d');ctx.drawImage(imgEl,0,0);
    c.toBlob(function(blob){
      if(!blob){showToast('⚠️ 无法下载，新窗口打开');setTimeout(function(){window.open(currentImgUrl,'_blank')},300);return}
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;a.download='moe_'+Date.now()+'.jpg';a.click();
      URL.revokeObjectURL(url);showToast('✅ 下载完成')
    },'image/jpeg',0.92)
  }catch(e){showToast('⚠️ 受限制，新窗口打开');setTimeout(function(){window.open(currentImgUrl,'_blank')},300)}
}

function toggleFav(){
  if(!currentImgUrl){showToast('⚠️ 暂无图片');return}
  var idx=favs.findIndex(function(f){return f.u===currentImgUrl});
  if(idx>-1){favs.splice(idx,1);showToast('💔 已取消收藏');favDot.style.display=favs.length?'block':'none'}
  else{
    var thumb=generateThumbnail();
    favs.unshift({u:currentImgUrl,n:getSrc(cur).n,t:Date.now(),thumb:thumb});
    showToast('💝 已收藏');favDot.style.display='block';spawnHeart()
  }
  if(favs.length>300)favs=favs.slice(0,300);
  localStorage.setItem('mg_favs_v3',JSON.stringify(favs));updateFavIcon();updateTabFavBadge()
}

function generateThumbnail(){
  var imgEl=aIm();
  try{
    var c=document.createElement('canvas');
    var maxW=400, maxH=600;
    var w=imgEl.naturalWidth, h=imgEl.naturalHeight;
    if(!w||!h)return currentImgUrl;
    if(w>maxW){h=h*(maxW/w);w=maxW}
    if(h>maxH){w=w*(maxH/h);h=maxH}
    c.width=Math.round(w);c.height=Math.round(h);
    var ctx=c.getContext('2d');ctx.drawImage(imgEl,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.7)
  }catch(e){return currentImgUrl}
}

/* ============================================================
   GESTURE HANDLING — FIXED
   Single tap → show/hide UI
   Double tap (350ms) → fullscreen
   Long press (800ms) → toggle favorite
   Swipe left/right (90px) → next/prev image
   ============================================================ */
var tx=0, ty=0, tapTimer=null, longPressTimer=null, lastTapTime=0, gestureStarted=false, gestureMoved=false;

function clearTapState(){
  clearTimeout(tapTimer);tapTimer=null;
  clearTimeout(longPressTimer);longPressTimer=null;
}

stage.addEventListener('touchstart',function(e){
  if(e.target.closest('button,.tab,.tabbar,.api-modal,.nbtn,.vbtn,.edge-arrow'))return;
  if(e.touches.length!==1)return;
  e.preventDefault(); // Prevent browser default behavior (zoom, selection, etc.)
  gestureStarted=true; gestureMoved=false;
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
  clearTimeout(longPressTimer);
  longPressTimer=setTimeout(function(){
    if(!gestureMoved){toggleFav();clearTapState();gestureStarted=false}
  },800);
},{passive:false});

stage.addEventListener('touchmove',function(e){
  if(!gestureStarted)return;
  var dx=e.touches[0].clientX-tx, dy=e.touches[0].clientY-ty;
  if(Math.abs(dx)>8||Math.abs(dy)>8)gestureMoved=true;
  // Cancel long press if finger has moved
  if(gestureMoved){clearTimeout(longPressTimer);clearTimeout(tapTimer);tapTimer=null}
},{passive:false});

stage.addEventListener('touchend',function(e){
  clearTimeout(longPressTimer);
  if(!gestureStarted)return;
  gestureStarted=false;
  if(e.target.closest('button,.tab,.tabbar,.api-modal,.nbtn,.vbtn,.edge-arrow'))return;
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  // Swipe — only if finger moved significantly and wasn't just a tap tremor
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>90&&gestureMoved){
    clearTapState();
    dx>0?goH(-1):(hp>=HI.length-1?load():goH(1));
    return
  }
  // Tap — only if finger didn't move much
  if(Math.abs(dx)<12&&Math.abs(dy)<12){
    var n=Date.now();
    if(n-lastTapTime<350){
      // Double tap → fullscreen
      clearTimeout(tapTimer);tapTimer=null;
      lastTapTime=0;
      toggleFullscreen();
      return
    }
    lastTapTime=n;
    clearTimeout(tapTimer);
    tapTimer=setTimeout(function(){
      // Single tap → show/hide UI
      if(topbar.classList.contains('hidden')){showUI()}else{hideUI()}
      tapTimer=null;
    },360);
  }
},{passive:false});

function showApiDetail(id){
  var s=getSrc(id); if(!s)return;

  var h='<div class="api-title">'+ci.i+' '+s.n+'</div><div class="api-cat">'+s.c+' · '+s.method+' · '+s.type+'</div>';

  // URL — copy button copies only the URL
  var urlDisplay=s.u.length>65?s.u.substring(0,62)+'…':s.u;
  var urlEscaped=s.u.replace(/'/g,"\\'");
  h+='<div class="api-section"><h4>📡 请求地址</h4><div class="docs-code"><span style="color:#e8c86a">'+s.method+'</span> '+urlDisplay+'<button class="copy-btn" onclick="event.stopPropagation();copyBtn(this,\''+urlEscaped+'\')">复制URL</button></div></div>';

/* ============================================================
   FAVORITES PAGE
   ============================================================ */
function buildFavsPage(){
  var grid=$('favs-grid'), empty=$('favs-empty');
  if(!favs.length){
    grid.innerHTML='';empty.style.display='block';
    updateTabFavBadge();
    return
  }
  empty.style.display='none';
  var h='';
  favs.forEach(function(f,i){
    var thumb=f.thumb||f.u;
    var dateStr='';
    if(f.t){var d=new Date(f.t);dateStr=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
    h+='<div class="fav-card" onclick="viewFav('+i+')">';
    h+='<img src="'+thumb+'" loading="lazy" onerror="this.style.opacity=\'0.3\'" alt="'+f.n+'">';
    h+='<div class="fav-overlay"><div><span class="fav-name">'+f.n+'</span><div class="fav-date">'+dateStr+'</div></div>';
    h+='<button class="fav-remove" onclick="event.stopPropagation();removeFav('+i+')">✕</button></div>';
    h+='</div>';
  });
  grid.innerHTML=h;
  updateTabFavBadge();
}

function viewFav(i){
  var f=favs[i];
  if(!f)return;
  navigateTo('viewer');
  currentImgUrl=f.u;currentThumb=f.thumb||f.u;currentMeta=null;
  var tL=nEl(), tI=nIm(), aL=aEl();showDots();
  var img=new Image();var to=setTimeout(function(){img.src='';hideStatus();showToast('⚠️ 加载超时')},12000);
  img.onload=function(){clearTimeout(to);tI.src=f.u;
    currentImgUrl=tI.currentSrc||tI.src||f.u;
    aL.classList.remove('active');tL.classList.add('active');ly=tL.id;
    onImgLoad(tI);hideStatus();showToast('💝 '+f.n)};
  img.onerror=function(){clearTimeout(to);hideStatus();showToast('⚠️ 图片失效')};
  img.src=f.u
}

function copyAllFavs(){
  if(!favs.length){showToast('⚠️ 收藏夹为空');return}
  var urls=favs.map(function(f){return f.u}).join('\n');
  copyToClipboard(urls,function(){showToast('✅ 已复制 '+favs.length+' 个链接')},function(){showToast('❌ 复制失败')})
}

function clearFavs(){
  favs=[];localStorage.setItem('mg_favs_v3',[]);
  favDot.style.display='none';updateFavIcon();buildFavsPage();updateTabFavBadge();showToast('🗑 已清空')
}

function removeFav(i){
  favs.splice(i,1);localStorage.setItem('mg_favs_v3',JSON.stringify(favs));
  favDot.style.display=favs.length?'block':'none';updateFavIcon();buildFavsPage();updateTabFavBadge();showToast('已删除')
}

   ============================================================ */
function buildDocsPage(){
  var h='';
  CO.forEach(function(cat){
    if(!D[cat])return;
    var ci=CATS[cat]||{i:'🖼️',c:'#c8a882'};
    h+='<div class="docs-section"><h3>'+ci.i+' '+cat+'</h3>';
    for(var k in D[cat]){
      var s=D[cat][k];
      var urlEscaped=s.u.replace(/'/g,"\\'");
      h+='<div class="docs-code" style="margin-bottom:16px"><span style="color:#e8c86a">'+s.method+'</span> '+s.u+'<button class="copy-btn" onclick="event.stopPropagation();copyBtn(this,\''+urlEscaped+'\')">复制URL</button><br><span style="font-size:9px;color:var(--muted)">'+s.n+' — '+s.desc+'</span></div>';
    }
    h+='</div>';
  });
  $('docs-content').innerHTML=h;
}

/* ============================================================
   UTILS
   ============================================================ */
function showToast(m){clearTimeout(ttm);toast.textContent=m;toast.classList.add('show');ttm=setTimeout(function(){toast.classList.remove('show')},1800)}

function copyToClipboard(t,ok,fail){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(fail);return}
  try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);ok()}catch(e){fail()}
}

function copyBtn(btn,t){
  var orig=btn.textContent;
  copyToClipboard(t,function(){btn.textContent='✓ 已复制';btn.classList.add('copied');setTimeout(function(){btn.textContent=orig;btn.classList.remove('copied')},1500)},function(){showToast('❌ 复制失败')})
}

// Register Service Worker for CORS proxy (handles Lolicon API POST requests)
if('serviceWorker' in navigator){
  // Check if there's already a controlling SW
  if(navigator.serviceWorker.controller){
    swReady=true;
    console.log('💫 SW already controlling page');
  }
  navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(function(reg){
    console.log('💫 SW registered');
    if(reg.active&&!reg.installing){swReady=true}
  }).catch(function(err){
    console.warn('SW registration failed:', err);
  });
}

updateBadge();applySourceOrientation();updateFavIcon();updateTabFavBadge();

function doInitLoad(){
  initDone=true;
  load(true);showLoading();
  showUI();resetUITimer();
}

// Wait for SW activation if current source is JSON (Lolicon API via POST)
if(getSrc(cur).type==='json' && 'serviceWorker' in navigator){
  if(navigator.serviceWorker.controller){
    // SW already controlling, proceed immediately
    console.log('💫 SW already active, loading immediately');
    doInitLoad();
  }else{
    // Show waiting UI and wait for SW
    showSWWaiting();
    // Fallback: if SW doesn't activate in 3s, show error
    setTimeout(function(){
      if(!initDone && !navigator.serviceWorker.controller){
        swStatus.innerHTML='<div>⚠️ 代理激活超时</div><span style="font-size:11px;color:var(--muted);display:block;margin-top:4px">Service Worker 可能需要手动刷新页面才能激活</span><button onclick="location.reload()">刷新页面</button><button onclick="switchSrc()" style="margin-left:8px;background:rgba(255,255,255,.05);border-color:var(--border);color:var(--text)">切换图源</button>';
      }
    },3000);
  }
}else{
  doInitLoad();
}

})();
